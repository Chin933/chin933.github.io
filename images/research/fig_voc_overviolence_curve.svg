<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Commercial return over VOC supply restriction</title>
  <desc id="desc">A hump-shaped return curve peaks at thirty percent of historical restriction. Historical restriction lies to the right of the peak and retains thirty-eight percent of benchmark return.</desc>
